<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#008fca">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/totem/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<title>Totem</title>
<style>
  /* Estilo Patachoca: celeste + magenta + azul noche sobre blanco, Poppins/Rubik, esquinas casi rectas. */
  :root { --primary:#008fca; --accent:#d91571; --ink:#0a021c; --bg:#f2f3f5; --line:#c8cfd5; --r:7px; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html,body { width:100%; height:100%; background:#000; overflow:hidden; font-family:Rubik,'Segoe UI',system-ui,sans-serif; color:var(--ink); touch-action:manipulation; overscroll-behavior:none; }
  h1,h2,.price,.btn,#logo,#clock { font-family:Poppins,Rubik,sans-serif; }
  #stage { position:absolute; left:50%; top:50%; width:1080px; height:1920px; transform-origin:center; overflow:hidden; background:#fff; }

  /* Cabecera blanca como la del sitio */
  #top { position:absolute; top:0; left:0; right:0; height:120px; z-index:20; display:flex; align-items:center; justify-content:space-between; padding:0 48px; background:#fff; border-bottom:6px solid var(--primary); }
  #logo { font-size:48px; font-weight:700; letter-spacing:6px; color:var(--ink); display:flex; align-items:center; }
  #logo img { height:60px; width:auto; }
  #clock { font-size:42px; font-weight:600; color:var(--ink); font-variant-numeric:tabular-nums; }

  #ads { position:absolute; left:0; right:0; top:120px; bottom:90px; overflow:hidden; background:#fff; }
  .slide { position:absolute; inset:0; opacity:0; transition:opacity .8s; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:60px 80px 160px; color:#fff; }
  .slide.in { opacity:1; }
  .slide img, .slide video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .slide img.ph { opacity:0; transition:opacity .8s; }
  .slide img.ph.on { opacity:1; }
  .slide .cap { position:absolute; left:0; right:0; bottom:0; padding:36px 60px; background:linear-gradient(#0000,#0a021ccc); color:#fff; font-family:Poppins,sans-serif; font-size:56px; font-weight:700; }
  .slide h1 { font-size:140px; line-height:1.05; font-weight:800; overflow-wrap:anywhere; }
  .slide h2 { font-size:60px; font-weight:400; margin-top:40px; opacity:.95; }
  .slide .price { margin-top:70px; font-size:104px; font-weight:800; background:var(--accent); color:#fff; padding:12px 64px; border-radius:var(--r); }
  .empty { position:absolute; inset:0; display:grid; place-items:center; font-family:Poppins,sans-serif; font-size:64px; font-weight:700; color:var(--primary); text-align:center; padding:80px; }

  #ticker { position:absolute; left:0; right:0; bottom:0; height:90px; background:var(--ink); z-index:20; overflow:hidden; display:flex; align-items:center; color:#fff; }
  #ticker span { white-space:nowrap; font-size:38px; padding-left:100%; animation:tick 40s linear infinite; }
  @keyframes tick { to { transform:translateX(-100%); } }

  /* Ícono sutil del sorteo */
  #cta { position:absolute; right:36px; bottom:120px; width:120px; height:120px; z-index:20; border:0; border-radius:50%; background:#ffffff26; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); display:grid; place-items:center; cursor:pointer; opacity:.6; transition:opacity .3s, transform .15s; }
  #cta:active { opacity:1; transform:scale(.92); }
  #cta svg { width:60px; height:60px; fill:none; stroke:#fff; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; filter:drop-shadow(0 1px 3px #0006); }
  #forzar { position:absolute; top:0; right:0; width:260px; height:130px; z-index:26; }
  #aviso { position:absolute; top:140px; left:50%; transform:translateX(-50%); z-index:27; background:var(--ink); color:#fff; padding:10px 32px; border-radius:var(--r); font-size:32px; display:none; }
  #offline { position:absolute; top:140px; left:50%; transform:translateX(-50%); z-index:25; background:var(--accent); color:#fff; padding:8px 28px; border-radius:var(--r); font-size:28px; display:none; }

  /* Juego */
  #game { position:absolute; inset:0; z-index:30; background:var(--bg); display:none; flex-direction:column; align-items:center; padding:120px 60px 60px; }
  #game::before { content:''; position:absolute; left:0; right:0; top:0; height:440px; background:var(--primary); }
  #game > * { position:relative; }
  #game.on { display:flex; }
  #game h1 { font-size:88px; font-weight:800; text-align:center; color:#fff; line-height:1.1; }
  #game .sub { font-size:44px; color:#fff; opacity:.95; margin:16px 0 96px; text-align:center; }
  .close { position:absolute !important; top:28px; right:40px; font-size:56px; line-height:1; width:96px; height:96px; border-radius:50%; background:#ffffff33; border:0; color:#fff; z-index:5; }
  .field { width:860px; margin:12px 0; }
  .field label { font-size:36px; font-weight:500; color:var(--ink); display:block; margin-bottom:8px; }
  .field .inp { width:100%; height:110px; border-radius:var(--r); background:#fff; color:var(--ink); font-size:54px; display:flex; align-items:center; padding:0 30px; border:4px solid var(--line); overflow:hidden; white-space:nowrap; }
  .field .inp.focus { border-color:var(--accent); }
  .btn { margin-top:30px; height:124px; padding:0 100px; border:0; border-radius:var(--r); background:var(--accent); color:#fff; font-size:54px; font-weight:700; letter-spacing:1px; cursor:pointer; }
  .btn:disabled { opacity:.4; }
  .err { color:#b91c1c; font-size:38px; margin-top:16px; min-height:46px; text-align:center; font-weight:500; }

  #kb { position:absolute !important; left:0; right:0; bottom:0; padding:20px 20px 30px; background:#fff; border-top:2px solid var(--line); display:none; flex-direction:column; gap:12px; z-index:6; }
  #kb.on { display:flex; }
  #kb .row { display:flex; gap:10px; justify-content:center; }
  #kb .k { flex:1; max-width:92px; height:110px; border:0; border-radius:var(--r); background:var(--bg); color:var(--ink); font-size:50px; font-weight:500; font-family:Rubik,sans-serif; }
  #kb .k:active { background:var(--line); }
  #kb .k.w { max-width:260px; flex:2; } #kb .k.ok { background:var(--accent); color:#fff; max-width:300px; flex:3; font-weight:600; }

  #wheelWrap { position:relative; width:880px; height:880px; margin-top:10px; }
  #wheel { width:100%; height:100%; border-radius:50%; box-shadow:0 0 0 14px #fff, 0 0 0 28px var(--accent), 0 24px 60px #0a021c40; transition:transform 6s cubic-bezier(.12,.7,.1,1); }
  #pointer { position:absolute; left:50%; top:-48px; transform:translateX(-50%); width:0; height:0; border-left:46px solid transparent; border-right:46px solid transparent; border-top:104px solid var(--ink); filter:drop-shadow(0 6px 8px #0a021c66); z-index:3; }
  #hub { position:absolute; left:50%; top:50%; width:160px; height:160px; margin:-80px; border-radius:50%; background:#fff; border:10px solid var(--accent); box-shadow:0 0 30px #0a021c40; display:grid; place-items:center; font-family:Poppins,sans-serif; font-size:34px; font-weight:800; color:var(--accent); z-index:2; }

  #result { position:absolute; inset:0; z-index:40; background:#0a021cd9; display:none; align-items:center; justify-content:center; }
  #result.on { display:flex; }
  #result .card { width:880px; padding:70px 50px; border-radius:var(--r); background:#fff; color:var(--ink); text-align:center; border-top:16px solid var(--accent); }
  #result .emoji { font-size:170px; } #result h2 { font-size:76px; font-weight:800; margin:20px 0; color:var(--accent); } #result p { font-size:46px; color:#4c5a67; }
  .conf { position:absolute; top:-40px; width:18px; height:30px; z-index:50; animation:fall linear forwards; }
  @keyframes fall { to { transform:translateY(2000px) rotate(720deg); } }
</style>
</head>
<body>
<div id="stage">
  <div id="top"><div id="logo"></div><div id="clock"></div></div>
  <div id="ads"></div>
  <div id="offline">Sin conexión</div>
  <div id="aviso"></div>
  <div id="forzar"></div>
  <button id="cta" aria-label="Jugar">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg>
  </button>
  <div id="ticker"><span id="tickerText"></span></div>

  <div id="game">
    <button class="close" id="closeGame">✕</button>
    <div id="gameBody" style="display:flex;flex-direction:column;align-items:center;width:100%"></div>
    <div id="kb"></div>
  </div>
  <div id="result"><div class="card"></div></div>
</div>
<script src="/totem/env.js"></script>
<script src="/totem/totem.js"></script>
</body>
</html>
